  <body>
    <div id="root"></div>
    <aside id="bas-voice-status" aria-live="polite" style="position:fixed;right:14px;bottom:14px;z-index:50;min-width:220px;padding:10px 12px;border:1px solid rgba(34,211,238,.35);border-radius:10px;background:rgba(8,15,30,.9);box-shadow:0 8px 30px rgba(0,0,0,.3);font:12px/1.45 'IBM Plex Mono',monospace;color:#cbd5e1;backdrop-filter:blur(8px)">
      <div style="color:#67e8f9;font-weight:600;letter-spacing:.08em;text-transform:uppercase">Voice agent</div>
      <div id="bas-voice-status-text">Connecting…</div>
    </aside>
    <script>
      (function(){
        const api=location.protocol==='file:'?'http://localhost:8000':location.origin;
        const el=document.getElementById('bas-voice-status-text');
        async function refresh(){
          try{const r=await fetch(api+'/state',{cache:'no-store'});const s=await r.json();const v=s.voice||{};
            el.textContent=(v.enabled?'ON':'OFF')+' · '+(v.backend||'unavailable')+' · '+(v.queued||0)+' queued';
            el.style.color=v.enabled&&v.backend!=='unavailable'?'#86efac':'#fbbf24';
          }catch(e){el.textContent='Backend offline';el.style.color='#fca5a5';}
        }
        refresh();setInterval(refresh,2000);
      })();
    </script>
  </body>
